<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin — Tidar Sayur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0a;
      --surface: #111a11;
      --card: #162016;
      --border: #1f2f1f;
      --primary: #4caf50;
      --primary-dark: #2e7d32;
      --primary-light: #a5d6a7;
      --text: #f0fdf4;
      --muted: #6b7280;
      --danger: #ef4444;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Poppins',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x: hidden; }

    /* --- GAYA HALAMAN LOGIN --- */
    #login-page {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 20px;
    }

    .login-card {
      background: var(--surface);
      width: 100%;
      max-width: 400px;
      padding: 40px;
      border-radius: 28px;
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .login-icon {
      font-size: 3rem;
      margin-bottom: 20px;
      display: inline-block;
      background: rgba(76, 175, 80, 0.1);
      width: 80px;
      height: 80px;
      line-height: 80px;
      border-radius: 20px;
    }

    .login-card h2 { margin-bottom: 8px; font-weight: 800; }
    .login-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 30px; }

    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--primary-light); margin-bottom: 8px; text-transform: uppercase; }
    
    .login-input {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: white;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }

    .login-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1); }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
    
    #error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 15px;
      display: none;
      padding: 10px;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 10px;
    }

    .back-to-shop { display: block; margin-top: 25px; color: var(--muted); text-decoration: none; font-size: 0.85rem; }
    .back-to-shop:hover { color: var(--text); }

    /* --- DASHBOARD LAYOUT (Hidden by default) --- */
    .layout { display: none; min-height: 100vh; }
    /* ... (Sisa CSS Dashboard Anda tetap sama di bawah) ... */
    
    .sidebar { width:240px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); padding:24px 16px; display:flex; flex-direction:column; gap:8px; position:sticky; top:0; height:100vh; overflow-y:auto; }
    .sidebar-logo { display:flex; align-items:center; gap:10px; padding:8px 12px 20px; border-bottom:1px solid var(--border); margin-bottom:8px; }
    .sidebar-logo-icon { width:36px; height:36px; background:var(--primary); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
    .sidebar-logo-text { font-weight:900; font-size:1rem; color:var(--text); }
    .sidebar-logo-text span { color:var(--primary-light); }
    .nav-label { font-size:0.72rem; font-weight:700; color:var(--muted); letter-spacing:0.08em; padding:12px 12px 4px; text-transform:uppercase; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:12px; color:var(--muted); font-size:0.88rem; font-weight:500; cursor:pointer; text-decoration:none; transition:0.15s; }
    .nav-item:hover { background:var(--card); color:var(--text); }
    .nav-item.active { background:rgba(76,175,80,0.15); color:var(--primary-light); font-weight:700; }
    .sidebar-footer { margin-top:auto; padding-top:16px; border-top:1px solid var(--border); }
    .back-btn { display:flex; align-items:center; gap:8px; padding:10px 14px; background:rgba(76,175,80,0.1); border:1px solid rgba(76,175,80,0.25); border-radius:12px; color:var(--primary-light); font-size:0.85rem; font-weight:600; cursor:pointer; text-decoration:none; transition:0.15s; width:100%; }
    
    .main { flex:1; overflow-x:hidden; }
    .topbar { position:sticky; top:0; z-index:10; background:rgba(10,15,10,0.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); padding:16px 28px; display:flex; align-items:center; justify-content:space-between; }
    .content { padding:28px; }
    .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px; }
    .stat-card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:20px 22px; transition:0.2s; }
    .stat-value { font-size:2rem; font-weight:900; color:var(--text); }
    .charts-grid { display:grid; grid-template-columns:2fr 1fr; gap:20px; margin-bottom:20px; }
    .chart-card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:24px; }
    .chart-card.full { grid-column:span 2; }
    .table-card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:24px; margin-bottom:20px; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; padding:10px 14px; font-size:0.78rem; color:var(--muted); border-bottom:1px solid var(--border); }
    td { padding:12px 14px; font-size:0.88rem; border-bottom:1px solid rgba(255,255,255,0.04); }
    .badge { padding:3px 10px; border-radius:999px; font-size:0.75rem; font-weight:700; }
    .badge.new { background:rgba(76,175,80,0.15); color:#6ee7b7; }
  </style>
</head>
<body>

<div id="login-page">
  <div class="login-card">
    <div class="login-icon">🔒</div>
    <h2>Admin Login</h2>
    <p>Silakan masukkan sandi untuk mengakses dashboard Tidar Sayur.</p>
    
    <div class="input-group">
      <label for="password">Kata Sandi</label>
      <input type="password" id="password-input" class="login-input" placeholder="••••••••">
    </div>
    
    <button class="login-btn" onclick="handleLogin()">Buka Dashboard</button>
    <div id="error-msg">Sandi salah! Silakan coba lagi.</div>
    
    <a href="index.html" class="back-to-shop">← Kembali ke Toko</a>
  </div>
</div>

<div class="layout" id="dashboard-layout">
  <nav class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">🌿</div>
      <div class="sidebar-logo-text">Tidar<span>Sayur</span></div>
    </div>
    <div class="nav-label">Menu</div>
    <a class="nav-item active" href="#"><span class="nav-icon">📊</span> Dashboard</a>
    <a class="nav-item" href="#"><span class="nav-icon">🛒</span> Kelola Produk</a>
    <div class="sidebar-footer">
      <a class="back-btn" href="index.html">← Kembali ke Toko</a>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <div style="font-weight:800; font-size:1.1rem;">📊 Dashboard Pesanan</div>
      <div id="topbar-date" style="color:var(--muted); font-size:0.85rem;"></div>
    </div>

    <div class="content">
      <div class="stats-row">
        <div class="stat-card">
          <div style="color:var(--muted); font-size:0.85rem;">Total Pesanan</div>
          <div class="stat-value" id="stat-orders">0</div>
        </div>
        <div class="stat-card">
          <div style="color:var(--muted); font-size:0.85rem;">Total Pendapatan</div>
          <div class="stat-value" id="stat-revenue">Rp0</div>
        </div>
      </div>

      <div class="table-card">
        <div style="font-weight:800; margin-bottom:15px;">📋 Pesanan Terbaru</div>
        <table>
          <thead>
            <tr>
              <th>Pemesan</th>
              <th>Produk</th>
              <th>Total</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="orders-tbody">
            </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // 1. PENGATURAN LOGIN
  // ==========================================
  const SANDI_BENAR = "sayursegar123"; // GANTI SANDI ANDA DI SINI

  function handleLogin() {
    const input = document.getElementById('password-input').value;
    const error = document.getElementById('error-msg');
    
    if (input === SANDI_BENAR) {
      // Simpan status login di session (hilang jika browser ditutup)
      sessionStorage.setItem('isAdminLoggedIn', 'true');
      showDashboard();
    } else {
      error.style.display = 'block';
      document.getElementById('password-input').value = '';
    }
  }

  function showDashboard() {
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('dashboard-layout').style.display = 'flex';
    initDashboard(); // Jalankan fungsi dashboard Anda
  }

  // Cek jika sudah login sebelumnya
  window.onload = function() {
    if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
      showDashboard();
    }
  };

  // Support tombol Enter
  document.getElementById('password-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleLogin();
  });


  // ==========================================
  // 2. LOGIKA DASHBOARD (Data & UI)
  // ==========================================
  function initDashboard() {
    const orders = JSON.parse(localStorage.getItem('tidarsayur_orders') || '[]');
    
    // Update Tanggal
    document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

    // Update Stats
    document.getElementById('stat-orders').textContent = orders.length;
    const totalRev = orders.reduce((sum, o) => sum + o.totalPrice, 0);
    document.getElementById('stat-revenue').textContent = new Intl.NumberFormat('id-ID', { style:'currency', currency:'IDR', maximumFractionDigits:0 }).format(totalRev);

    // Render Tabel
    const tbody = document.getElementById('orders-tbody');
    if (orders.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--muted);">Belum ada pesanan masuk.</td></tr>';
    } else {
      tbody.innerHTML = orders.reverse().slice(0, 10).map(o => `
        <tr>
          <td><strong>${o.customerName}</strong></td>
          <td style="color:var(--muted); font-size:0.8rem;">${o.cart.map(i => i.name + ' x' + i.qty).join(', ')}</td>
          <td style="font-weight:700; color:var(--primary-light);">Rp${o.totalPrice.toLocaleString('id-ID')}</td>
          <td><span class="badge new">Baru</span></td>
        </tr>
      `).join('');
    }
  }
</script>

</body>
</html>
