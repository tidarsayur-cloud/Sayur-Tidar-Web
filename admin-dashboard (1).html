<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Tidar Sayur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0a0f0a;
      --surface: #111a11;
      --card: #162016;
      --border: #1f2f1f;
      --primary: #4caf50;
      --primary-light: #a5d6a7;
      --text: #f0fdf4;
      --muted: #6b7280;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Poppins',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    /* --- LOGIN PAGE --- */
    #login-page { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify:center; z-index:10000; display:flex; align-items:center; justify-content:center; }
    .login-card { background:var(--surface); padding:40px; border-radius:24px; border:1px solid var(--border); text-align:center; width:90%; max-width:400px; }
    .login-input { width:100%; padding:12px; margin:20px 0; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:white; outline:none; }
    .login-btn { width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:10px; cursor:pointer; font-weight:700; }

    /* --- DASHBOARD LAYOUT --- */
    .layout { display:none; min-height:100vh; }
    .sidebar { width:240px; background:var(--surface); border-right:1px solid var(--border); padding:20px; display:flex; flex-direction:column; gap:10px; }
    .main { flex:1; padding:30px; overflow-y:auto; }
    
    .stats-row { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:20px; margin-bottom:30px; }
    .stat-card { background:var(--card); padding:20px; border-radius:15px; border:1px solid var(--border); }
    .stat-label { color:var(--muted); font-size:0.8rem; text-transform:uppercase; }
    .stat-value { font-size:1.8rem; font-weight:800; color:var(--primary-light); }

    /* --- CHART STYLING --- */
    .charts-container { display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:30px; }
    .chart-card { background:var(--card); padding:20px; border-radius:20px; border:1px solid var(--border); }
    .chart-title { font-weight:700; margin-bottom:15px; font-size:1rem; display:flex; align-items:center; gap:8px; }

    @media (max-width: 800px) {
      .charts-container { grid-template-columns: 1fr; }
      .sidebar { display:none; }
    }

    table { width:100%; border-collapse:collapse; background:var(--card); border-radius:15px; overflow:hidden; }
    th { text-align:left; padding:15px; background:var(--surface); color:var(--muted); font-size:0.8rem; }
    td { padding:15px; border-bottom:1px solid var(--border); font-size:0.9rem; }
  </style>
</head>
<body>

<div id="login-page">
  <div class="login-card">
    <h2>🔒 Admin Login</h2>
    <input type="password" id="passInput" class="login-input" placeholder="Masukkan Sandi...">
    <button class="login-btn" onclick="checkAuth()">Masuk</button>
  </div>
</div>

<div class="layout" id="dash">
  <aside class="sidebar">
    <h2 style="color:var(--primary)">🌿 Tidar Admin</h2>
    <hr style="border:0; border-top:1px solid var(--border); margin:10px 0;">
    <p style="font-size:0.8rem; color:var(--muted)">Menu Utama</p>
    <div style="padding:10px; background:rgba(76,175,80,0.1); border-radius:8px; color:var(--primary-light)">📊 Dashboard</div>
    <a href="index.html" style="color:var(--muted); text-decoration:none; margin-top:auto;">← Kembali ke Toko</a>
  </aside>

  <main class="main">
    <header style="margin-bottom:30px;">
      <h1>Ringkasan Penjualan</h1>
      <p style="color:var(--muted)">Data otomatis diperbarui dari transaksi pelanggan.</p>
    </header>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Pesanan</div>
        <div class="stat-value" id="count-orders">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Pendapatan</div>
        <div class="stat-value" id="sum-revenue">Rp0</div>
      </div>
    </div>

    <div class="charts-container">
      <div class="chart-card">
        <div class="chart-title">📈 Tren Pesanan (7 Hari Terakhir)</div>
        <canvas id="orderChart"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">💰 Pendapatan Harian (Rp)</div>
        <canvas id="revenueChart"></canvas>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-title">📋 Daftar Transaksi Terakhir</div>
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Nama</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
  const PASS = "sayursegar123";

  function checkAuth() {
    if(document.getElementById('passInput').value === PASS) {
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('dash').style.display = 'flex';
      renderDashboard();
    } else {
      alert("Sandi Salah!");
    }
  }

  function renderDashboard() {
    const rawData = localStorage.getItem('tidarsayur_orders') || '[]';
    const orders = JSON.parse(rawData);

    // 1. Update Angka Statistik
    document.getElementById('count-orders').innerText = orders.length;
    const total = orders.reduce((s, o) => s + o.totalPrice, 0);
    document.getElementById('sum-revenue').innerText = "Rp" + total.toLocaleString('id-ID');

    // 2. Olah Data untuk Grafik (Grup per Tanggal)
    const dailyData = {};
    orders.forEach(o => {
      const date = o.timestamp.split('T')[0]; // Ambil YYYY-MM-DD
      if(!dailyData[date]) dailyData[date] = { count: 0, revenue: 0 };
      dailyData[date].count++;
      dailyData[date].revenue += o.totalPrice;
    });

    const labels = Object.keys(dailyData).sort().slice(-7); // Ambil 7 hari terakhir
    const orderCounts = labels.map(l => dailyData[l].count);
    const revenueAmounts = labels.map(l => dailyData[l].revenue);

    // 3. Render Grafik Pesanan (Line Chart)
    new Chart(document.getElementById('orderChart'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Jumlah Pesanan',
          data: orderCounts,
          borderColor: '#4caf50',
          backgroundColor: 'rgba(76, 175, 80, 0.2)',
          fill: true,
          tension: 0.3
        }]
      },
      options: { plugins: { legend: { display: false } } }
    });

    // 4. Render Grafik Pendapatan (Bar Chart)
    new Chart(document.getElementById('revenueChart'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Rupiah',
          data: revenueAmounts,
          backgroundColor: '#a5d6a7',
          borderRadius: 5
        }]
      },
      options: { plugins: { legend: { display: false } } }
    });

    // 5. Isi Tabel
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = orders.reverse().slice(0, 5).map(o => `
      <tr>
        <td>${o.timestamp.split('T')[0]}</td>
        <td>${o.customerName}</td>
        <td style="color:#a5d6a7; font-weight:bold">Rp${o.totalPrice.toLocaleString('id-ID')}</td>
      </tr>
    `).join('');
  }
</script>

</body>
</html>
